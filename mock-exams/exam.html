<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Claude Architect · Mock Exams</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0f1020;color:#e8e9f3}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 170px}
h1{font-size:20px;margin:10px 0 3px;color:#e8e9f3}
.sub{color:#9aa0bf;font-size:13px;margin:0 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;background:#1a1b2e;border:2px solid #2c2e4a;color:#e8e9f3;
  padding:12px 8px;border-radius:14px;font-size:14px;font-weight:700;
  cursor:pointer;text-align:center;-webkit-appearance:none;appearance:none;
  min-height:58px;line-height:1.2}
.tab small{display:block;color:#9aa0bf;font-weight:400;font-size:11px;margin-top:4px}
.tab.on{border-color:#c98a5e;background:#231f35;color:#fff}
.tab.on small{color:#c98a5e}
.note{background:#181a30;border:1px solid #2c2e4a;border-radius:12px;
  padding:10px 12px;font-size:12px;color:#9aa0bf;margin-bottom:10px}
.meta{color:#9aa0bf;font-size:12px;margin:4px 2px 14px;display:flex;justify-content:space-between}
.sec{margin:22px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:#c98a5e;font-weight:600}
.q{background:#1a1b2e;border:1px solid #2c2e4a;border-radius:16px;padding:14px 14px 10px;margin:12px 0}
.qt{font-weight:600;margin-bottom:10px;font-size:15px;line-height:1.4}
.qn{color:#7aa2f7;margin-right:6px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:12px;margin:6px 0;
  border:1px solid #2c2e4a;border-radius:12px;background:#22243d;cursor:pointer;
  -webkit-user-select:none;user-select:none}
.bx{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #5a607a;
  display:flex;align-items:center;justify-content:center;font-size:13px;
  color:#0f1020;margin-top:1px;flex-shrink:0;font-weight:700}
.opt.sq .bx{border-radius:6px}
.ltr{font-weight:700;color:#9aa0bf;margin-right:4px}
.opt.sel{border-color:#7aa2f7;background:#192342}
.opt.sel .bx{background:#7aa2f7;border-color:#7aa2f7}
.opt.cor{border-color:#4ec9a3;background:#0a2520}
.opt.cor .bx{background:#4ec9a3;border-color:#4ec9a3}
.opt.wrg{border-color:#f0698e;background:#280d18}
.opt.wrg .bx{background:#f0698e;border-color:#f0698e}
.opt.mis{border-color:#4ec9a3;border-style:dashed}
.exp{display:none;margin:10px 0 4px;padding:10px 12px;border-left:3px solid #c98a5e;
  background:#0e1228;border-radius:0 10px 10px 0;font-size:14px;color:#cdd0e8;line-height:1.5}
.exp.on{display:block}
.exp b{color:#4ec9a3}
.scn textarea{width:100%;min-height:100px;background:#22243d;color:#e8e9f3;
  border:1px solid #2c2e4a;border-radius:12px;padding:10px;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;resize:vertical;margin-top:8px;-webkit-appearance:none}
.reveal{display:block;margin-top:8px;background:transparent;border:1px solid #2c2e4a;
  color:#7aa2f7;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;
  cursor:pointer;-webkit-appearance:none;appearance:none;text-align:left;width:100%}
.moda{display:none;margin-top:8px;padding:10px 12px;background:#0e1228;
  border-radius:10px;font-size:14px;color:#cdd0e8;border:1px solid #2c2e4a;line-height:1.5}
.moda.on{display:block}
.moda b{color:#4ec9a3}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:200;
  background:#0d0f1e;border-top:1px solid #2c2e4a;
  padding:12px 16px;
  padding-bottom:max(12px,env(safe-area-inset-bottom));
  display:flex;gap:10px;align-items:center}
.sc{flex:1;font-size:13px;color:#9aa0bf;line-height:1.4}
.sc b{color:#e8e9f3}
.pass{color:#4ec9a3 !important}
.fail{color:#f0698e !important}
.gbtn{padding:13px 20px;border-radius:12px;font-size:15px;font-weight:700;
  cursor:pointer;-webkit-appearance:none;appearance:none;border:none;min-width:72px}
.gbtn.gr{background:#c98a5e;color:#1a0800}
.gbtn.rs{background:#22243d;color:#9aa0bf;border:1px solid #2c2e4a}
</style>
</head>
<body>

<div class="wrap">
  <h1>Claude Certified Architect</h1>
  <p class="sub">3 mock exams · tap to answer · Grade when done · works offline</p>

  <!-- Static tabs — always visible even if JS errors -->
  <div class="tabs">
    <button class="tab on" id="tA" onclick="pick('A')">Form A<small>Foundational</small></button>
    <button class="tab"    id="tB" onclick="pick('B')">Form B<small>Intermediate</small></button>
    <button class="tab"    id="tC" onclick="pick('C')">Form C<small>Advanced</small></button>
  </div>

  <div class="note">Sections 1–2 auto-graded &middot; Section 3 shows model answer &middot; Passing: <b>75 / 100</b></div>
  <div class="meta"><span id="fn">Form A &mdash; Foundational</span><span id="prg"></span></div>
  <div id="ex"><p style="text-align:center;color:#9aa0bf;padding:40px 0">Loading&hellip;</p></div>
</div>

<div class="bar">
  <div class="sc" id="sc">Not graded yet</div>
  <button class="gbtn rs" onclick="doReset()">Reset</button>
  <button class="gbtn gr" onclick="doGrade()">Grade</button>
</div>

scn:[
["C1","Agent design (Opus 4.8): The agent keeps spawning subagents for trivial single-file reads, and overtriggers a tool because the prompt says 'CRITICAL: You MUST use this tool'. What prompt and parameter changes would you make, and why?","<b>Soften the tool instruction</b> from 'CRITICAL: You MUST use this tool' to a calibrated 'Use this tool when…' — current Opus models follow instructions literally and aggressive language overtriggers. Add explicit subagent guidance: spawn subagents only for parallel/independent work; for single-file reads or sequential ops, work directly. Optionally tune <b>effort</b> (e.g. high) and add a 'don’t over-engineer / don’t ask on minor decisions' instruction."],
["C2","Context at scale: A research agent runs for hours across hundreds of tool calls and must retain learnings across separate sessions. Describe which three context-management mechanisms you'd combine and what each does.","<b>Compaction</b> (server-side summarizes earlier context near the window limit — append response.content each turn to preserve the compaction block). <b>Context editing</b> (prunes stale tool results / thinking blocks to keep the transcript lean). <b>Memory</b> (file-based store persisting learnings across separate sessions). Editing/compaction work within a session; memory is for cross-session persistence."],
["C3","Migration: A service calls claude-opus-4-6 with thinking: {type:'enabled', budget_tokens:8000}, temperature:0.7, and a final assistant-turn prefill of '{\"name\": \"'. Migrating to claude-opus-4-8. List the specific code changes required to avoid 400 errors and what replaces the prefill.","<b>1.</b> Replace thinking:{type:'enabled',budget_tokens:8000} → thinking:{type:'adaptive'} (+ optional output_config.effort) — fixed budgets 400 on Opus 4.8. <b>2.</b> Remove temperature:0.7 — sampling params 400. <b>3.</b> Remove the assistant-turn prefill — prefills 400 — replace with <b>structured outputs</b> (output_config.format with a JSON schema) or a system-prompt instruction. Then set model to <b>claude-opus-4-8</b>."]
]},

scn:[
["C1","Caching architecture under load: A RAG service has a 25K-token shared instruction+few-shot preamble and a per-user retrieved-document block (varies per request), followed by the user's question. Traffic is bursty with multi-minute idle gaps. Describe your breakpoint strategy, TTL choice, whether to pre-warm, and the one ordering rule that must hold.","<b>Breakpoint:</b> Place the first (and only) breakpoint at the end of the 25K shared preamble. The per-user doc block + question come after it with no breakpoint (they vary). <b>TTL:</b> Because gaps exceed the 5-min default, either re-warm just under the TTL or use <b>ttl:'1h'</b> on the preamble breakpoint (writes ~2×, but survives gaps and pays off across each burst). <b>Pre-warm:</b> Use max_tokens:0 at startup only if first-request latency is user-visible. <b>Ordering rule:</b> Stable content (frozen system + deterministic preamble) must physically precede volatile per-request content — otherwise nothing caches regardless of markers."],
["C2","Fable 5 production hardening: You're deploying claude-fable-5 for a security-tooling assistant where benign requests occasionally trip safety classifiers. Describe: (a) how you detect a refusal in code, (b) the recommended opt-in resilience to ship by default, (c) two operational requirements you must plan for.","<b>(a)</b> Check <b>response.stop_reason == 'refusal'</b> BEFORE reading content[0] (content may be empty pre-output or partial mid-stream). <b>(b)</b> Ship <b>server-side fallbacks</b> by default (betas:['server-side-fallback-2026-06-01'], fallbacks:[{model:'claude-opus-4-8'}]); on Bedrock/Vertex/Foundry use the client-side refusal-fallback middleware instead. <b>(c)</b> The org must meet <b>30-day data retention</b> (ZDR → 400 on every request); and you must <b>size the fallback model's rate limits</b> for expected refusal volume — if the fallback is rate-limited, the original refusal is returned instead."],
["C3","Multi-surface deployment: A regulated enterprise must run on AWS infrastructure with IAM-based access control, and wants Managed Agents plus server-side tools with same-day feature parity. Compare Claude Platform on AWS vs Amazon Bedrock for this requirement, state which you'd choose and why, and note one capability NOT available on the option you reject.","Choose <b>Claude Platform on AWS</b>: it is Anthropic-operated with <b>same-day API parity</b>, supports <b>Managed Agents</b> and server-side tools, uses <b>AWS-native IAM + Marketplace billing</b>, and uses bare first-party model IDs (e.g. claude-opus-4-8). <b>Amazon Bedrock</b> is partner-operated, has a feature subset, uses anthropic.-prefixed model IDs, and does <b>NOT</b> support Managed Agents or Anthropic server-side tools — failing the stated requirement. Capability missing on the rejected option (Bedrock): <b>Managed Agents</b> (and server-side tools generally)."]
]}};

/* ---- STATE ---- */
var cur='A';
var ans={A:{},B:{},C:{}};
var done={A:false,B:false,C:false};

/* ---- TABS ---- */
function pick(k){
  cur=k;
  ['A','B','C'].forEach(function(x){
    document.getElementById('t'+x).className='tab'+(x===k?' on':'');
  });
  render();
  window.scrollTo(0,0);
}

/* ---- RENDER ---- */
function render(){
  try{
    var ex=EXAMS[cur];
    document.getElementById('fn').textContent=ex.name;
    var h='';
    h+=sec('Section 1 · Multiple choice · 2 pts each');
    ex.single.forEach(function(q){h+=makeQ(q,true);});
    h+=sec('Section 2 · Select all correct · 3 pts each · all-or-nothing');
    ex.multi.forEach(function(q){h+=makeQ(q,false);});
    h+=sec('Section 3 · Scenario design · self-check');
    ex.scn.forEach(function(s){h+=makeScn(s);});
    document.getElementById('ex').innerHTML=h;
    updatePrg();
    if(done[cur])showScore();
  }catch(e){
    document.getElementById('ex').innerHTML='<p style="color:#f0698e;padding:20px;font-size:14px">Error loading exam: '+e.message+'<br>Please reload the page.</p>';
  }
}

function sec(t){return '<div class="sec">'+t+'</div>';}

function makeQ(row,isSingle){
  var id=row[0],q=row[1],opts=row[2],key=row[3],exp=row[4];
  var tp=isSingle?'sq':'mq';
  var userAns=ans[cur][id];
  var isGraded=done[cur];
  var h='<div class="q" data-id="'+id+'" data-tp="'+tp+'">';
  h+='<div class="qt"><span class="qn">'+id+'</span>'+q;
  if(!isSingle)h+=' <small style="color:#9aa0bf;font-weight:400">(select all)</small>';
  h+='</div>';
  ['A','B','C','D'].forEach(function(L){
    if(opts[L]==null)return;
    var chosen=isSingle?(userAns===L):((userAns||[]).indexOf(L)>=0);
    var correct=isSingle?(key===L):(key.indexOf(L)>=0);
    var cls='opt'+(isSingle?'':' sq');
    var mark='';
    if(isGraded){
      if(chosen&&correct){cls+=' cor';mark='✓';}
      else if(chosen&&!correct){cls+=' wrg';mark='✗';}
      else if(!chosen&&correct){cls+=' mis';}
    }else if(chosen){
      cls+=' sel';
      mark=isSingle?'●':'✓';
    }
    h+='<div class="'+cls+'" data-l="'+L+'" onclick="tap(\''+id+'\',\''+L+'\',\''+tp+'\')"><div class="bx">'+mark+'</div><div><span class="ltr">'+L+'.</span>'+opts[L]+'</div></div>';
  });
  var ansStr=Array.isArray(key)?key.join(', '):key;
  h+='<div class="exp'+(isGraded?' on':'')+'"><b>Answer: '+ansStr+'</b> — '+exp+'</div>';
  h+='</div>';
  return h;
}

function makeScn(row){
  var id=row[0],q=row[1],model=row[2];
  var tv=(ans[cur]['txt_'+id]||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  return '<div class="q scn"><div class="qt"><span class="qn">'+id+'</span>'+q+'</div><textarea placeholder="Write your answer here…" oninput="saveTxt(\''+id+'\',this.value)">'+tv+'</textarea><button class="reveal" onclick="toggleM(this)">Show model answer</button><div class="moda"><b>Model answer:</b> '+model+'</div></div>';
}

/* ---- INTERACTION ---- */
function tap(id,letter,type){
  if(done[cur])return;
  var isSingle=(type==='sq');
  if(isSingle){
    ans[cur][id]=(ans[cur][id]===letter)?null:letter;
  }else{
    var a=(ans[cur][id]||[]).slice();
    var i=a.indexOf(letter);
    if(i>=0)a.splice(i,1);else a.push(letter);
    a.sort();
    ans[cur][id]=a;
  }
  /* update only this question's options in-place */
  var card=document.querySelector('.q[data-id="'+id+'"]');
  if(!card){render();return;}
  var userAns=ans[cur][id];
  card.querySelectorAll('.opt').forEach(function(opt){
    var L=opt.getAttribute('data-l');
    var chosen=isSingle?(userAns===L):((userAns||[]).indexOf(L)>=0);
    opt.className='opt'+(isSingle?'':' sq')+(chosen?' sel':'');
    var bx=opt.querySelector('.bx');
    if(bx)bx.textContent=chosen?(isSingle?'●':'✓'):'';
  });
  updatePrg();
}

function saveTxt(id,val){ans[cur]['txt_'+id]=val;}

function toggleM(btn){
  var m=btn.nextElementSibling;
  var show=!m.classList.contains('on');
  m.className='moda'+(show?' on':'');
  btn.textContent=show?'Hide model answer':'Show model answer';
}

function updatePrg(){
  var ex=EXAMS[cur],n=0,total=ex.single.length+ex.multi.length;
  ex.single.forEach(function(q){if(ans[cur][q[0]])n++;});
  ex.multi.forEach(function(q){if((ans[cur][q[0]]||[]).length)n++;});
  document.getElementById('prg').textContent=n+'/'+total+' answered';
}

/* ---- GRADE ---- */
function doGrade(){
  done[cur]=true;
  render();
  showScore();
  window.scrollTo(0,0);
}

function showScore(){
  var ex=EXAMS[cur],pts=0;
  ex.single.forEach(function(q){if(ans[cur][q[0]]===q[3])pts+=2;});
  ex.multi.forEach(function(q){
    var u=(ans[cur][q[0]]||[]).slice().sort().join('');
    var k=q[3].slice().sort().join('');
    if(u===k)pts+=3;
  });
  var pct=Math.round(pts/74*100);
  var cls=pct>=75?'pass':'fail';
  var msg=pct>=75?'✓ On track to pass':'Below pass on auto Qs';
  document.getElementById('sc').innerHTML='S1+S2: <b>'+pts+'/74</b> &middot; S3 self-score /26 &middot; <span class="'+cls+'">'+msg+'</span>';
}

function doReset(){
  ans[cur]={};
  done[cur]=false;
  document.getElementById('sc').textContent='Not graded yet';
  render();
  window.scrollTo(0,0);
}

/* ---- INIT ---- */
render();
</script>
