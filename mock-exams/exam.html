<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>Claude Certified Architect — Mock Exams</title>
<style>
  :root{
    --bg:#0f1020; --card:#1a1b2e; --card2:#22243d; --ink:#e8e9f3; --muted:#9aa0bf;
    --accent:#c98a5e; --accent2:#7aa2f7; --ok:#4ec9a3; --bad:#f0698e; --line:#2c2e4a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 120px}
  header h1{font-size:20px;margin:6px 0 2px;letter-spacing:.2px}
  header p{color:var(--muted);margin:0 0 16px;font-size:13px}
  .pickrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .pick{flex:1;min-width:90px;background:var(--card);border:1px solid var(--line);color:var(--ink);
    padding:12px 10px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;text-align:center}
  .pick.active{border-color:var(--accent);background:linear-gradient(180deg,#2a2238,#1f2036);color:#fff}
  .pick small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:2px}
  .meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin:4px 2px 14px}
  .sec{margin:22px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--accent)}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 8px;margin:12px 0}
  .q .qt{font-weight:600;margin-bottom:10px}
  .q .qt .num{color:var(--accent2);margin-right:6px}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;margin:7px 0;border:1px solid var(--line);
    border-radius:12px;background:var(--card2);cursor:pointer;transition:.12s}
  .opt:active{transform:scale(.995)}
  .opt .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:transparent;margin-top:1px}
  .opt.single .box{border-radius:50%}
  .opt.sel{border-color:var(--accent2);background:#243056}
  .opt.sel .box{background:var(--accent2);border-color:var(--accent2);color:#0b1020}
  .opt .ol{font-weight:700;margin-right:2px;color:var(--muted)}
  /* graded states */
  .opt.correct{border-color:var(--ok);background:#16382f}
  .opt.correct .box{background:var(--ok);border-color:var(--ok);color:#06241b}
  .opt.wrong{border-color:var(--bad);background:#3a1c28}
  .opt.wrong .box{background:var(--bad);border-color:var(--bad);color:#2a0a12}
  .opt.missed{border-color:var(--ok);border-style:dashed}
  .exp{display:none;margin:8px 2px 4px;padding:10px 12px;border-left:3px solid var(--accent);
    background:#181a30;border-radius:0 10px 10px 0;font-size:14px;color:#d4d6ea}
  .exp.show{display:block}
  .exp b{color:var(--ok)}
  .scn .qt{margin-bottom:8px}
  .scn textarea{width:100%;min-height:90px;background:var(--card2);color:var(--ink);border:1px solid var(--line);
    border-radius:12px;padding:10px;font:15px/1.45 inherit;resize:vertical}
  .reveal{margin-top:8px;background:transparent;border:1px solid var(--line);color:var(--accent2);
    padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
  .model{display:none;margin-top:8px;padding:10px 12px;background:#181a30;border-radius:10px;font-size:14px;color:#d4d6ea}
  .model.show{display:block}
  .model b{color:var(--ok)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(15,16,32,.92);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
  .bar .score{flex:1;font-size:14px;color:var(--muted)}
  .bar .score b{color:var(--ink);font-size:16px}
  .btn{background:var(--accent);color:#1a0f08;border:none;padding:13px 18px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600}
  .pass{color:var(--ok)!important}.fail{color:var(--bad)!important}
  .hint{color:var(--muted);font-size:12px;margin:2px 2px 0}
  .note{background:#181a30;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--muted);margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Claude Certified Architect</h1>
    <p>Mock exam pack · 3 forms · tap answers, then Grade. Works offline.</p>
  </header>

  <div class="pickrow" id="picker"></div>
  <div class="note">Sections 1–2 are auto-graded. Section 3 (scenarios) shows a model answer to self-check. Passing score: <b>75 / 100</b>.</div>
  <div class="meta"><span id="formName"></span><span id="progress"></span></div>

  <div id="exam"></div>
</div>

<div class="bar">
  <div class="score" id="scoreBox">Not graded yet</div>
  <button class="btn ghost" id="resetBtn">Reset</button>
  <button class="btn" id="gradeBtn">Grade</button>
</div>

<script>
/* ---------------- DATA ---------------- */
const O=(a,b,c,d)=>({A:a,B:b,C:c,D:d});
const EXAMS={

  ["C1","Cost & caching: 40K-token KB prepended to every request + short varying question, steady volume. Structure, breakpoint placement, verification?","Put the 40K KB first (stable prefix), varying question last. One cache_control breakpoint at the END of the KB (the shared portion), not after the question. Steady traffic → default 5-min ephemeral TTL keeps it warm. Verify usage.cache_read_input_tokens > 0; if zero, audit for silent invalidators (timestamps/UUIDs, unsorted JSON, varying tools). Keep the system prompt frozen."],

  ["A9","A fable-5 thinking block replayed to a DIFFERENT model is:",O("Rejected with 400","Dropped from the prompt before pricing (silent, unbilled)","Billed at double rate","Converted to a text block"),"B","<b>Dropped before pricing</b>, typically silently, unbilled."],
  ["A10","Task Budgets differ from max_tokens because:",O("Hard per-response ceiling the model can't see","Tell the model its loop budget; it sees a countdown and self-moderates","Only apply to streaming","Replace effort"),"B","Model <b>sees the countdown</b> and self-moderates; max_tokens is hidden."],
  ["A11","Minimum task_budget.total:",O("1,024","20,000","64,000","No minimum"),"B","Minimum is <b>20,000</b> tokens."],
  ["A12","Which change invalidates EVERYTHING (tools+system+messages)?",O("Toggling thinking","Changing tool_choice","Add/remove/reorder a tool definition","Changing the last user message"),"C","<b>Tool definition changes</b> invalidate everything."],
  ["A13","A turn appends 30 tool blocks; next request misses cache because:",O("TTL expired","20-block lookback exceeded; add an intermediate breakpoint","Tools can't be cached","Model changed"),"B","<b>20-block lookback</b> exceeded."],
  ["A14","Programmatic tool calling reduces token cost by:",O("Compressing the system prompt","Running calls in a script so intermediate results stay out of context","Using a cheaper model","Disabling thinking"),"B","Intermediate results <b>stay out of Claude's context</b>; only final output returns."],
  ["A15","Tool search beats loading all schemas upfront because it:",O("Appends discovered schemas (preserves cache)","Removes the need for descriptions","Runs tools server-side","Doubles the context window"),"A","It <b>appends</b> schemas, preserving the cache."],
  ["A16","fable-5 declines mid-stream after partial output. Correct handling:",O("Treat partial output as final","Discard the partial (billed, incomplete) and handle refusal","Partial is never billed","Auto-retry on same model"),"B","Mid-stream refusal bills the partial; <b>discard it</b>."],
  ["A17","Server-side fallbacks supported target model at launch:",O("claude-haiku-4-5","claude-opus-4-8","claude-sonnet-4-5","Any model you name"),"B","<b>claude-opus-4-8</b> at launch."],
  ["A18","Sticky routing for server-side fallbacks means:",O("Every request always hits the requested model","After a fallback, later non-streaming requests served by fallback ~1h","The fallback is permanent","Streaming pinned 24h"),"B","Non-streaming follow-ups served by the fallback for <b>~1 hour</b>."],
  ["A19","To generate a PR on Managed Agents, besides a github_repository mount you need:",O("Nothing — the mount can open PRs","The GitHub MCP server (mount is filesystem+git only)","A second environment","A custom open_pr tool only"),"B","PR creation needs the <b>GitHub MCP server</b>."],
  ["A20","A vault environment_variable credential is exposed to the sandbox as:",O("The real secret in an env var","An opaque placeholder; substituted at egress for allowed hosts","A file under /memories","A tool definition"),"B","An <b>opaque placeholder</b>; substituted at egress."],
  ["A21","Keep a secret host-side when a vault doesn't fit (self-hosted sandbox):",O("Put the key in the system prompt","A custom tool: agent emits custom_tool_use, orchestrator calls the API","The Files API","The metadata field"),"B","A <b>custom tool</b> keeps the secret host-side."],
  ["A22","When draining a session stream, break on:",O("Any session.status_idle","Idle with terminal stop_reason, or session.status_terminated","First agent.message","span.model_request_start"),"B","Break on <b>idle-with-terminal-stop-reason</b> or terminated."],
  ["A23","SSE stream has no replay. On reconnect:",O("Resume from 'now', accept the gap","Fetch events.list() history + dedupe by ID while tailing live","Delete and recreate the session","Switch to webhooks only"),"B","Fetch history + <b>dedupe by event ID</b>."],
  ["A24","Opus 4.8 review harness 'only high-severity' shows lower recall. Cause/fix:",O("Capability regression; downgrade","Model follows the filter literally; report everything, filter downstream","Can't review code; add tools","Increase max_tokens"),"B","4.8 follows severity filters <b>literally</b>; filter downstream."],
  ["A25","Managed Agents availability across providers:",O("Works on Bedrock, Vertex, Foundry","First-party + Claude Platform on AWS only","Only on Bedrock","Requires a self-hosted sandbox everywhere"),"B","First-party + <b>Claude Platform on AWS</b> only."]
 ],
 multi:[
  ["B1","True about cache invalidation tiers:",O("Changing tool_choice keeps tools+system cache","Toggling thinking keeps tools+system, invalidates messages downstream","Model switch forces full rebuild","Changing message content invalidates tools cache"),["A","B","C"],"Message content doesn't invalidate the tools cache (D false)."],
  ["B2","Correct about fable-5 refusal billing:",O("Pre-output refusal (empty content) not billed","Mid-stream refusal bills the streamed output","With fallbacks, declined-before-output isn't billed; rescue bills at fallback rates","All refusals always billed in full"),["A","B","C"],"Not all refusals are billed in full (D false)."],
  ["B3","Valid agent-specific caching workarounds:",O("Append role:'system' instead of editing top-level system","Spawn a subagent on a cheaper model vs switching the main loop","Use tool search to append schemas vs swapping tools","Re-create the agent each turn to refresh cache"),["A","B","C"],"Re-creating the agent each turn is an anti-pattern (D false)."],
  ["B4","True about Managed Agents environments:",O("config.type is cloud or self_hosted","Names must be unique (409 on dup)","unrestricted allows full egress (except legal blocklist)","Self-hosted supports environment_variable vault creds"),["A","B","C"],"Self-hosted does NOT support env_variable vault creds (D false)."],
  ["B5","True about high-res vision on Opus 4.7+:",O("Max resolution 2576px long edge","Coordinates map 1:1 to pixels","Full-res images can use more tokens","Requires a special beta header"),["A","B","C"],"High-res is automatic, no beta header (D false)."],
  ["B6","Correct about caching economics/verification:",O("1h TTL writes cost ~2× and need more reads to pay off","input_tokens is the uncached remainder only","Total = input + cache_creation + cache_read","Non-zero cache_creation proves a read occurred"),["A","B","C"],"cache_creation proves a write, not a read (D false)."],
  ["B7","Correct uses of mid-conversation system messages:",O("Preserve the cached history prefix","Prompt-injection-safe operator channel","Must follow a user message, can't be messages[0]","Supported on every model, no 400 possible"),["A","B","C"],"They're model-gated and can 400 on unsupported models (D false)."],
  ["B8","True about choosing a surface for an agent:",O("Managed Agents = Anthropic runs the loop + hosts the sandbox","Claude API + tool use = you host compute / custom runtime","A single LLM call suffices for classification/summarization","Always build an agent regardless of complexity"),["A","B","C"],"Start simple — don't always build an agent (D false)."]
 ],
 scn:[
  ["C1","Caching under load: 25K shared preamble + per-user retrieved-doc block (varies) + question. Bursty traffic w/ multi-minute idle gaps. Breakpoint strategy, TTL, pre-warm, the one ordering rule?","First breakpoint at the END of the 25K shared preamble (the reusable prefix). The per-user doc block + question come AFTER it, no breakpoint (they vary). Gaps exceed the 5-min TTL → re-warm just under TTL or use ttl:'1h' on the preamble (write ~2× but survives gaps). Pre-warm at startup with max_tokens:0 only if first-request latency is user-visible. Ordering rule: stable content (frozen system + deterministic preamble) must physically precede volatile per-request content."],
  ["C2","Fable 5 hardening: security-tooling assistant where benign requests sometimes trip classifiers. (a) detect refusal, (b) opt-in resilience by default, (c) two ops requirements.","(a) Check response.stop_reason=='refusal' BEFORE reading content[0] (may be empty/partial). (b) Ship server-side fallbacks by default (betas:['server-side-fallback-2026-06-01'], fallbacks:[{model:'claude-opus-4-8'}]); on Bedrock/Vertex/Foundry use the client-side refusal-fallback middleware. (c) Org must meet 30-day data retention (ZDR → 400 every request); size the fallback model's rate limits for expected refusal volume, else the refusal is returned instead."],
  ["C3","Multi-surface: regulated enterprise on AWS w/ IAM access control, wants Managed Agents + server-side tools + same-day parity. Compare Claude Platform on AWS vs Bedrock; pick + one capability missing on the rejected option.","Choose Claude Platform on AWS: Anthropic-operated, same-day API parity, supports Managed Agents + server-side tools, AWS-native IAM + Marketplace billing, bare model IDs (claude-opus-4-8). Bedrock is partner-operated, feature subset, anthropic.-prefixed IDs, and does NOT support Managed Agents or Anthropic server-side tools — failing the requirement. Capability missing on the rejected option (Bedrock): Managed Agents (and server-side tools)."]
 ]
}
};
const LETTERS=["A","B","C","D"];

/* ---------------- STATE ---------------- */
let cur="A";
const answers={A:{},B:{},C:{}};
const graded={A:false,B:false,C:false};

/* ---------------- RENDER ---------------- */
function buildPicker(){
  const p=document.getElementById("picker"); p.innerHTML="";
  Object.keys(EXAMS).forEach(k=>{
    const b=document.createElement("button");
    b.className="pick"+(k===cur?" active":"");
    const sub={A:"Foundational",B:"Intermediate",C:"Advanced"}[k];
    b.innerHTML="Form "+k+"<small>"+sub+"</small>";
    b.onclick=()=>{cur=k;render();};
    p.appendChild(b);
  });
}
function optionRow(qid,letter,text,type){
  const sel=type==="single"?answers[cur][qid]===letter:(answers[cur][qid]||[]).includes(letter);
  const div=document.createElement("div");
  div.className="opt "+(type==="single"?"single":"")+(sel?" sel":"");
  div.dataset.qid=qid; div.dataset.letter=letter; div.dataset.type=type;
  div.innerHTML='<div class="box">'+(type==="single"?"●":"✓")+'</div><div><span class="ol">'+letter+'.</span> '+text+'</div>';
  div.onclick=()=>{ if(graded[cur])return; toggle(qid,letter,type); render(); };
  return div;
}
function toggle(qid,letter,type){
  if(type==="single"){answers[cur][qid]=letter;}
  else{const a=new Set(answers[cur][qid]||[]); a.has(letter)?a.delete(letter):a.add(letter); answers[cur][qid]=[...a].sort();}
}
function render(){
  buildPicker();
  const ex=EXAMS[cur];
  document.getElementById("formName").textContent=ex.name;
  const exam=document.getElementById("exam"); exam.innerHTML="";

  const s1=document.createElement("div"); s1.className="sec"; s1.textContent="Section 1 · Multiple choice (2 pts each)"; exam.appendChild(s1);
  ex.single.forEach(([id,q,opts,ans,exp])=>exam.appendChild(qCard(id,q,opts,ans,exp,"single")));

  const s2=document.createElement("div"); s2.className="sec"; s2.textContent="Section 2 · Select all that apply (3 pts each, all-or-nothing)"; exam.appendChild(s2);
  ex.multi.forEach(([id,q,opts,ans,exp])=>exam.appendChild(qCard(id,q,opts,ans,exp,"multi")));

  const s3=document.createElement("div"); s3.className="sec"; s3.textContent="Section 3 · Scenario design (self-check)"; exam.appendChild(s3);
  ex.scn.forEach(([id,q,model])=>exam.appendChild(scnCard(id,q,model)));

  updateProgress();
  if(graded[cur]) applyGrade();
}
function qCard(id,q,opts,ans,exp,type){
  const c=document.createElement("div"); c.className="q"; c.dataset.qid=id; c.dataset.ans=Array.isArray(ans)?ans.join(""):ans; c.dataset.type=type;
  const t=document.createElement("div"); t.className="qt";
  t.innerHTML='<span class="num">'+id+'</span>'+q+(type==="multi"?' <span style="color:var(--muted);font-weight:400">(select all)</span>':"");
  c.appendChild(t);
  LETTERS.forEach(L=>{ if(opts[L]!=null) c.appendChild(optionRow(id,L,opts[L],type)); });
  const e=document.createElement("div"); e.className="exp"; e.innerHTML='<b>Answer: '+(Array.isArray(ans)?ans.join(", "):ans)+'</b> — '+exp; c.appendChild(e);
  return c;
}
function scnCard(id,q,model){
  const c=document.createElement("div"); c.className="q scn";
  const t=document.createElement("div"); t.className="qt"; t.innerHTML='<span class="num">'+id+'</span>'+q; c.appendChild(t);
  const ta=document.createElement("textarea"); ta.placeholder="Type your answer (not auto-graded)…";
  ta.value=answers[cur]["txt_"+id]||""; ta.oninput=()=>{answers[cur]["txt_"+id]=ta.value;}; c.appendChild(ta);
  const btn=document.createElement("button"); btn.className="reveal"; btn.textContent="Show model answer";
  const m=document.createElement("div"); m.className="model"; m.innerHTML="<b>Model answer.</b> "+model;
  btn.onclick=()=>{m.classList.toggle("show"); btn.textContent=m.classList.contains("show")?"Hide model answer":"Show model answer";};
  c.appendChild(btn); c.appendChild(m);
  return c;
}
function updateProgress(){
  const ex=EXAMS[cur]; const total=ex.single.length+ex.multi.length;
  let done=0;
  ex.single.forEach(([id])=>{if(answers[cur][id])done++;});
  ex.multi.forEach(([id])=>{if((answers[cur][id]||[]).length)done++;});
  document.getElementById("progress").textContent=done+" / "+total+" answered";
}

/* ---------------- GRADE ---------------- */
function grade(){
  graded[cur]=true;
  applyGrade();
}
function applyGrade(){
  const ex=EXAMS[cur]; let pts=0; const max=100;
  // section 1
  ex.single.forEach(([id,,,ans])=>{ if(answers[cur][id]===ans) pts+=2; });
  // section 2
  ex.multi.forEach(([id,,,ans])=>{ const a=(answers[cur][id]||[]).slice().sort().join(""); const k=ans.slice().sort().join(""); if(a===k) pts+=3; });
  // section 3: self-graded — assume credit shown separately; we report autoscore /74 plus note
  // visual
  document.querySelectorAll(".q[data-qid]").forEach(card=>{
    const id=card.dataset.qid, type=card.dataset.type, key=card.dataset.ans;
    const keyArr=key.split("");
    card.querySelectorAll(".opt").forEach(opt=>{
      const L=opt.dataset.letter; opt.style.pointerEvents="none";
      const chosen=type==="single"?answers[cur][id]===L:(answers[cur][id]||[]).includes(L);
      const correct=keyArr.includes(L);
      opt.classList.remove("sel");
      if(chosen&&correct) opt.classList.add("correct");
      else if(chosen&&!correct) opt.classList.add("wrong");
      else if(!chosen&&correct) opt.classList.add("missed");
    });
    card.querySelector(".exp").classList.add("show");
  });
  const auto=pts, autoMax=74;
  const sb=document.getElementById("scoreBox");
  const pct=Math.round(auto/autoMax*100);
  sb.innerHTML='Auto-graded (S1+S2): <b>'+auto+' / 74</b> · scenarios self-scored /26. '+
    '<span class="'+(pct>=75?"pass":"fail")+'">'+(pct>=75?"On track to pass":"Below pass on objective Qs")+'</span>';
  document.getElementById("gradeBtn").textContent="Graded";
  window.scrollTo({top:0,behavior:"smooth"});
}
function reset(){
  answers[cur]={}; graded[cur]=false;
  document.getElementById("gradeBtn").textContent="Grade";
  document.getElementById("scoreBox").textContent="Not graded yet";
  render();
}
document.getElementById("gradeBtn").onclick=grade;
document.getElementById("resetBtn").onclick=reset;
render();
</script>
